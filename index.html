<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Clearsite scans your websites and APIs for security issues and tells you how to fix each one."
    />
    <meta name="theme-color" content="#f5f7f6" />
    <title>Clearsite</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong theme.
      ;(function () {
        try {
          var raw = localStorage.getItem('clearsite:prefs')
          var prefs = raw ? JSON.parse(raw).state : null
          var mode = (prefs && prefs.theme) || 'light'
          if (mode === 'system') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', mode)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>Clearsite needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
