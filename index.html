<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="REDCELL: web security scanning console for red team operators." />
    <meta name="theme-color" content="#0a0a0c" />
    <title>REDCELL · Security Console</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong theme.
      ;(function () {
        try {
          var raw = localStorage.getItem('redcell:prefs')
          var prefs = raw ? JSON.parse(raw).state : null
          var mode = (prefs && prefs.theme) || 'dark'
          if (mode === 'system') mode = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.setAttribute('data-theme', mode)
          if (prefs && prefs.crt) document.documentElement.setAttribute('data-crt', 'on')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>REDCELL needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
